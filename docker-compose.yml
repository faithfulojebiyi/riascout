services:
  postgres:
    image: postgres:16-alpine
    ports:
      - '5442:5432'
    environment:
      POSTGRES_USER: riascout
      POSTGRES_PASSWORD: riascout
      POSTGRES_DB: riascout
    volumes:
      - riascout-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U riascout -d riascout']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6389:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  riascout-pg:
