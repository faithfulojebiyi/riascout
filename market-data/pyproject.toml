[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "riascout-adv-data"
version = "0.1.0"
description = "RIAScout SEC/IAPD acquisition and normalized market-data pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.3,<2",
  "httpx>=0.28,<1",
  "openpyxl>=3.1,<4",
  "pycountry>=24.6,<25",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
  "types-openpyxl>=3.1,<4",
]

[project.scripts]
riascout-adv-data = "riascout_adv_data.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/riascout_adv_data"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = "duckdb.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pycountry.*"
ignore_missing_imports = true
